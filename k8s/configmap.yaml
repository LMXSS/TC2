apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  RabbitMq__Host: "rabbitmq"
  Smtp__Enabled: "true"
  Smtp__Host: "mailpit"
  Smtp__Port: "1025"
  Smtp__FromAddress: "noreply@fcg.local"
  Smtp__FromName: "FIAP Cloud Games"
